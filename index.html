<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Arthi 💙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(180deg, #87CEEB 0%, #B0E0E6 50%, #E0F6FF 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.card{
width:100%;
max-width:430px;
background:rgba(255,255,255,.25);
backdrop-filter:blur(25px);
border-radius:35px;
padding:30px 25px;
text-align:center;
box-shadow:0 20px 60px rgba(135,206,235,.5);
border:2px solid rgba(255,255,255,.4);
animation:cardFloat 5s ease-in-out infinite;
}

@keyframes cardFloat{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

h1{
font-family:'Dancing Script',cursive;
font-size:52px;
color:#0984e3;
margin-bottom:15px;
text-shadow:0 0 20px rgba(116,185,255,.6);
animation:glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px rgba(116,185,255,.6);}
to{text-shadow:0 0 30px rgba(116,185,255,1);}
}

.slide-container{
width:240px;
height:320px;
margin:20px auto;
position:relative;
display:none;
}

.slide-box{
position:absolute;
width:100%;
height:100%;
opacity:0;
transform:scale(0.8);
transition: all 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

.slide-box.active{
opacity:1;
transform:scale(1);
}

.slide-img{
width:240px;
height:240px;
object-fit:cover;
border-radius:25px;
border:5px solid white;
box-shadow:0 15px 40px rgba(0,105,148,.4);
animation:imgPulse 3s ease-in-out infinite;
}

@keyframes imgPulse{
0%,100%{box-shadow:0 15px 40px rgba(0,105,148,.4);}
50%{box-shadow:0 20px 50px rgba(116,185,255,.7);}
}

.slide-text{
margin-top:15px;
color:#2d3436;
font-size:16px;
line-height:1.7;
font-weight:500;
min-height:60px;
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

#finalChance{
display:none;
font-family:'Dancing Script',cursive;
font-size:30px;
color:#0984e3;
margin:20px 0;
animation:fadeInPop 1.5s ease;
}

@keyframes fadeInPop{
0%{opacity:0; transform:scale(0.5) rotate(-5deg);}
70%{transform:scale(1.1) rotate(2deg);}
100%{opacity:1; transform:scale(1) rotate(0);}
}

button{
padding:16px 38px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#74b9ff,#0984e3);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
margin:10px;
transition:0.4s;
box-shadow:0 8px 25px rgba(116,185,255,.5);
}

button:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 15px 35px rgba(116,185,255,.7);
}

#btnGroup{
display:none;
animation:fadeIn 1s ease;
}

.heart{
position:absolute;
font-size:28px;
animation:floatHeart 7s ease-in infinite;
opacity:0;
color:#74b9ff;
}

@keyframes floatHeart{
0%{transform:translateY(100vh) scale(0) rotate(0deg); opacity:1;}
100%{transform:translateY(-100vh) scale(1.5) rotate(720deg); opacity:0;}
}

.sparkle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:sparkleAnim 2s infinite;
}

@keyframes sparkleAnim{
0%,100%{opacity:0; transform:scale(0);}
50%{opacity:1; transform:scale(1);}
}
</style>
</head>
<body>

<div class="card">
<h1>Sorry Arthi 💙</h1>

<div class="slide-container" id="slider"></div>

<div id="finalChance">Enakku oru chance kudu please 🙏<br>I promise I won't hurt you again ❤️</div>

<button id="startBtn">Open My Heart</button>

<div id="btnGroup">
<button onclick="alert('Thank you for giving me a chance ❤️')">I Forgive You</button>
<button onclick="alert('I\'m waiting for you... Please talk 🙏')">Can We Talk?</button>
</div>
</div>

<script>
// Photo + Message together
const slides = [
  {img:"IMG-20240720-WA0034.jpg", text:"Naa sryy Arthi... neraiya alaga kekuren 😔"},
  {img:"IMG-20250126-WA0053.jpg", text:"Anaiku naa panna adhu periya thappu"},
  {img:"IMG-20251112-WA0023.jpg", text:"Unna un frnds munadi asinga paduthiten 💔"},
  {img:"IMG-20251224-WA0021.jpg", text:"Adha nenaicha enaku azhuga varudhu"},
  {img:"IMG-20251224-WA0025.jpg", text:"Namma memories ellam romba azhaga iruku"},
  {img:"image.jpg", text:"Please enna mannichudu. Unna illama naan illa"}
];

let currentSlide = 0;
let started = false;
let slideInterval;

// Create slides
const slider = document.getElementById('slider');
slides.forEach((slide, index) => {
  let div = document.createElement('div');
  div.className = 'slide-box';
  div.innerHTML = `
    <img src="${slide.img}" class="slide-img" onerror="this.style.display='none'">
    <div class="slide-text">${slide.text}</div>
  `;
  if(index === 0) div.classList.add('active');
  slider.appendChild(div);
});

// Sparkles
for(let i=0; i<20; i++){
  let spark = document.createElement('div');
  spark.className = 'sparkle';
  spark.style.left = Math.random() * 100 + '%';
  spark.style.top = Math.random() * 100 + '%';
  spark.style.animationDelay = Math.random() * 2 + 's';
  document.querySelector('.card').appendChild(spark);
}

document.getElementById('startBtn').addEventListener('click', startSorry);

function startSorry(){
  if(started) return;
  started = true;

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('slider').style.display = 'block';

  slideInterval = setInterval(nextSlide, 4500);

  for(let j=0; j<40; j++){
    setTimeout(createHeart, j * 250);
  }
}

function nextSlide(){
  const slideBoxes = document.querySelectorAll('.slide-box');
  slideBoxes[currentSlide].classList.remove('active');
  currentSlide = (currentSlide + 1) % slideBoxes.length;
  slideBoxes[currentSlide].classList.add('active');

  // Last slide mudincha
  if(currentSlide === slideBoxes.length - 1){
    setTimeout(() => {
      clearInterval(slideInterval);
      document.getElementById('finalChance').style.display = 'block';
      document.getElementById('btnGroup').style.display = 'block';
    }, 4500);
  }
}

function createHeart(){
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '💙';
  heart.style.left = Math.random() * 100 + '%';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
</script>

</body>
</html>
