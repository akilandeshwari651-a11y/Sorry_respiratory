<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #B0E0E6 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
position:relative;
}

/* Clouds animation */
.cloud{
position:absolute;
background:white;
border-radius:50%;
opacity:0.7;
animation:floatCloud 60s linear infinite;
}

@keyframes floatCloud{
0%{transform:translateX(-200px);}
100%{transform:translateX(100vw);}
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.25);
backdrop-filter:blur(20px);
border-radius:30px;
padding:30px 25px;
text-align:center;
box-shadow:0 15px 50px rgba(135,206,235,.4);
border:2px solid rgba(255,255,255,.3);
z-index:10;
animation:cardIn 1s ease;
}

@keyframes cardIn{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

h1{
font-family:'Dancing Script',cursive;
font-size:50px;
color:#0984e3;
margin-bottom:15px;
text-shadow:0 2px 10px rgba(255,255,255,.8);
}

.slider-container{
width:230px;
height:230px;
margin:20px auto;
border-radius:50%;
border:6px solid white;
box-shadow:0 10px 30px rgba(0,105,148,.3);
overflow:hidden;
position:relative;
display:none;
}

.slide{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
opacity:0;
transition:opacity 1.5s ease-in-out;
}

.slide.active{
opacity:1;
}

#messageBox{
color:#2d3436;
font-size:17px;
line-height:1.9;
min-height:150px;
margin:25px 0;
font-weight:500;
display:none;
}

.cursor{
border-right:3px solid #0984e3;
animation:blink 0.8s infinite;
}

@keyframes blink{
50%{border-color:transparent;}
}

button{
padding:15px 35px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#74b9ff,#0984e3);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
margin:10px;
transition:0.4s;
box-shadow:0 8px 20px rgba(116,185,255,.4);
font-family:'Poppins',sans-serif;
}

button:hover{
transform:translateY(-4px);
box-shadow:0 12px 30px rgba(116,185,255,.6);
}

#btnGroup{
display:none;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.heart{
position:absolute;
font-size:25px;
animation:floatHeart 6s ease-in infinite;
opacity:0;
color:#74b9ff;
}

@keyframes floatHeart{
0%{transform:translateY(100vh) rotate(0deg); opacity:1;}
100%{transform:translateY(-100vh) rotate(360deg); opacity:0;}
}
</style>
</head>
