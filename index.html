<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Arthi 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Noto Sans Tamil','Poppins',sans-serif;
background:linear-gradient(180deg, #87CEEB 0%, #B0E0E6 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:15px 20px;
overflow-x:hidden;
position:relative;
}

.cloud{
position:absolute;
background:white;
border-radius:50px;
opacity:0.9;
animation:floatCloud 40s linear infinite;
display:flex;
align-items:center;
justify-content:center;
padding:10px 20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
z-index:0;
}

.cloud:before,.cloud:after{
content:'';
position:absolute;
background:white;
border-radius:50%;
}

.cloud:before{
width:50px;
height:50px;
top:-15px;
left:15px;
}
.cloud:after{
width:60px;
height:60px;
top:-20px;
right:15px;
}

.cloud-text{
position:relative;
z-index:2;
font-family:'Quicksand',sans-serif;
font-size:12px;
font-weight:700;
color:#0984e3;
white-space:nowrap;
}

@keyframes floatCloud{
0%{transform:translateX(-300px);}
100%{transform:translateX(100vw);}
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.35);
backdrop-filter:blur(25px);
border-radius:25px;
padding:20px;
margin-top:10px;
text-align:center;
box-shadow:0 15px 40px rgba(135,206,235,.4);
border:2px solid rgba(255,255,255,.4);
z-index:10;
}

h1{
font-family:'Dancing Script',cursive;
font-size:44px;
color:#0984e3;
margin-bottom:12px;
}

.slide-container{
width:220px;
height:300px;
margin:12px auto;
position:relative;
display:none;
}

.slide-box{
position:absolute;
width:100%;
height:100%;
opacity:0;
transform:scale(0.9);
transition: all 1s ease;
}

.slide-box.active{
opacity:1;
transform:scale(1);
}

.slide-img{
width:220px;
height:220px;
object-fit:cover;
border-radius:20px;
border:4px solid white;
box-shadow:0 10px 25px rgba(0,105,148,.3);
}

.slide-text{
margin-top:12px;
color:#2d3436;
font-size:16px;
line-height:1.7;
font-weight:500;
min-height:50px;
}

#finalChance{
display:none;
font-family:'Dancing Script',cursive;
font-size:26px;
color:#0984e3;
margin:15px 0;
}

button{
padding:14px 30px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#74b9ff,#0984e3);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
margin:8px;
}

#btnGroup{
display:none;
}

.heart{
position:absolute;
font-size:22px;
animation:floatHeart 6s ease-in infinite;
color:#0984e3;
z-index:1;
}

@keyframes floatHeart{
0%{transform:translateY(100vh); opacity:1;}
100%{transform:translateY(-100vh); opacity:0;}
}
</style>
</head>
<body>

<!-- Clouds with Sorry text only -->
<div class="cloud" style="width:180px; height:60px; top:8%; animation-delay:0s;">
  <div class="cloud-text">KD ACTING GUNDU 💙</div>
</div>

<div class="cloud" style="width:200px; height:65px; top:20%; animation-delay:15s;">
  <div class="cloud-text">SORRY ARTHI 🙏</div>
</div>

<div class="cloud" style="width:170px; height:55px; top:35%; animation-delay:30s;">
  <div class="cloud-text">ORU CHANCE KUDU</div>
</div>

<div class="cloud" style="width:190px; height:60px; top:50%; animation-delay:5s;">
  <div class="cloud-text">MANICHUDU PLEASE 😔</div>
</div>

<div class="card">
<h1>Sorry Arthi 💙</h1>

<div class="slide-container" id="slider"></div>

<div id="finalChance">எனக்கு ஒரு chance கொடு please 🙏<br>I promise இனிமே hurt பண்ண மாட்டேன் ❤️</div>

<button id="startBtn">Open My Heart</button>

<div id="btnGroup">
<button onclick="alert('மன்னித்ததற்கு நன்றி ❤️')">I Forgive You</button>
<button onclick="alert('பேசுவோமா... நான் wait பண்றேன் 🙏')">Can We Talk?</button>
</div>
</div>

<script>
const slides = [
  {img:"IMG-20240720-WA0034.jpg", text:"நான் sorry அர்தி... நிறைய அழகா கேக்குறேன் 😔"},
  {img:"IMG-20250126-WA0053.jpg", text:"அன்னைக்கு நான் பண்ணது பெரிய தப்பு"},
  {img:"IMG-20251112-WA0023.jpg", text:"உன்ன உன் friends முன்னாடி அசிங்க படுத்திட்டேன் 💔"},
  {img:"IMG-20251224-WA0021.jpg", text:"அத நினைச்சா எனக்கு அழுக வருது"},
  {img:"IMG-20251224-WA0025.jpg", text:"நம்ம memories எல்லாம் ரொம்ப அழகா இருக்கு"},
  {img:"image.jpg", text:"Please என்ன மன்னிச்சுடு. உன்ன இல்லாம நான் இல்ல"}
];

let currentSlide = 0;
let started = false;
let slideInterval;

const slider = document.getElementById('slider');
slides.forEach((slide, index) => {
  let div = document.createElement('div');
  div.className = 'slide-box';
  div.innerHTML = `
    <img src="${slide.img}" class="slide-img" onerror="this.style.display='none'">
    <div class="slide-text">${slide.text}</div>
  `;
  if(index === 0) div.classList.add('active');
  slider.appendChild(div);
});

document.getElementById('startBtn').addEventListener('click', startSorry);

function startSorry(){
  if(started) return;
  started = true;

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('slider').style.display = 'block';

  slideInterval = setInterval(nextSlide, 4500);

  for(let j=0; j<30; j++){
    setTimeout(createHeart, j * 300);
  }
}

function nextSlide(){
  const slideBoxes = document.querySelectorAll('.slide-box');
  slideBoxes[currentSlide].classList.remove('active');
  currentSlide = (currentSlide + 1) % slideBoxes.length;
  slideBoxes[currentSlide].classList.add('active');

  if(currentSlide === slideBoxes.length - 1){
    setTimeout(() => {
      clearInterval(slideInterval);
      document.getElementById('finalChance').style.display = 'block';
      document.getElementById('btnGroup').style.display = 'block';
    }, 4500);
  }
}

function createHeart(){
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '💙';
  heart.style.left = Math.random() * 100 + '%';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}
</script>

</body>
</html>
