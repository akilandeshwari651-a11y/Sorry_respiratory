<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Arthi 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(180deg, #1e3c72 0%, #2a5298 100%); /* dark blue bg */
min-height:100vh;
overflow:hidden;
}

.cloud{
position:absolute;
background:rgba(255,255,255,0.9);
border-radius:50px;
opacity:0.9;
animation:floatCloud 30s linear infinite;
display:flex;
align-items:center;
justify-content:center;
padding:10px 20px;
z-index:20;
pointer-events:none;
}

.cloud:before,.cloud:after{
content:'';
position:absolute;
background:rgba(255,255,255,0.9);
border-radius:50%;
}

.cloud:before{width:40px;height:40px;top:-10px;left:10px;}
.cloud:after{width:50px;height:50px;top:-15px;right:10px;}

.cloud-text{
position:relative;
z-index:21;
font-family:'Quicksand',sans-serif;
font-size:11px;
font-weight:700;
color:#0984e3;
white-space:nowrap;
}

@keyframes floatCloud{
0%{transform:translateX(-200px);}
100%{transform:translateX(calc(100vw + 200px));}
}

.slider{
width:100vw;
height:100vh;
position:relative;
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition: opacity 2s ease;
}

.slide.active{
opacity:1;
}

.slide-img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(0.75);
}

.glass-msg{
position:absolute;
bottom:80px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:380px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
border-radius:20px;
padding:20px;
border:1px solid rgba(255,255,255,0.3);
}

.glass-msg p{
color:white;
font-size:18px;
font-weight:400;
line-height:1.7;
text-align:center;
text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

h1{
position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);
font-family:'Dancing Script',cursive;
font-size:48px;
color:white;
z-index:15;
text-shadow:0 4px 20px rgba(0,0,0,0.7);
}

#startBtn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:18px 45px;
border:none;
border-radius:50px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
z-index:25;
border:2px solid rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<div class="cloud" style="width:160px; height:50px; top:10%; animation-delay:0s;">
  <div class="cloud-text">KD ACTING GUNDU</div>
</div>

<div class="cloud" style="width:180px; height:55px; top:22%; animation-delay:10s;">
  <div class="cloud-text">SORRY ARTHI</div>
</div>

<div class="cloud" style="width:170px; height:50px; top:38%; animation-delay:20s;">
  <div class="cloud-text">PLEASE FORGIVE</div>
</div>

<h1>Sorry Arthi 💙</h1>

<button id="startBtn">Tap to Start</button>

<div class="slider" id="slider"></div>

<script>
// TEMP: Testing ku photo illana ipdi irukum
const slides = [
  {img:"IMG-20240720-WA0034.jpg", text:"I'm truly sorry... I never meant to hurt you like this"},
  {img:"IMG-20250126-WA0053.jpg", text:"That day I acted stupid. I regret every second of it"},
  {img:"IMG-20251112-WA0023.jpg", text:"Embarrassing you in front of everyone was my biggest mistake"},
  {img:"IMG-20251224-WA0021.jpg", text:"I can't sleep thinking about what I did to you"},
  {img:"IMG-20251224-WA0025.jpg", text:"We had so many beautiful memories. I don't want to lose them"},
  {img:"image.jpg", text:"I know I don't deserve it... but please give me one chance to fix this"}
];

let currentSlide = 0;
let started = false;
let slideInterval;

const slider = document.getElementById('slider');
slides.forEach((slide, index) => {
  let div = document.createElement('div');
  div.className = 'slide';
  div.innerHTML = `
    <img src="${slide.img}" class="slide-img">
    <div class="glass-msg">
      <p>${slide.text}</p>
    </div>
  `;
  if(index === 0) div.classList.add('active');
  slider.appendChild(div);
});

document.getElementById('startBtn').addEventListener('click', startSorry);

function startSorry(){
  if(started) return;
  started = true;
  document.getElementById('startBtn').style.display = 'none';
  slideInterval = setInterval(nextSlide, 5500);
}

function nextSlide(){
  const slideBoxes = document.querySelectorAll('.slide');
  slideBoxes[currentSlide].classList.remove('active');
  currentSlide = (currentSlide + 1) % slideBoxes.length;
  slideBoxes[currentSlide].classList.add('active');
}
</script>

</body>
</html>
