<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sorry Arthi 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#0a0a0a;
overflow:hidden;
}

.cloud{
position:absolute;
background:rgba(255,255,255,0.8);
border-radius:50px;
opacity:0.7;
animation:floatCloud 40s linear infinite;
display:flex;
align-items:center;
justify-content:center;
padding:8px 18px;
z-index:20;
pointer-events:none;
backdrop-filter:blur(5px);
}

.cloud:before,.cloud:after{
content:'';
position:absolute;
background:rgba(255,255,255,0.8);
border-radius:50%;
}

.cloud:before{width:40px;height:40px;top:-10px;left:10px;}
.cloud:after{width:50px;height:50px;top:-15px;right:10px;}

.cloud-text{
position:relative;
z-index:21;
font-family:'Quicksand',sans-serif;
font-size:10px;
font-weight:700;
color:#0984e3;
white-space:nowrap;
}

@keyframes floatCloud{
0%{transform:translateX(-250px);}
100%{transform:translateX(calc(100vw + 250px));}
}

.slider{
width:100vw;
height:100vh;
position:relative;
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition: opacity 2s ease;
}

.slide.active{
opacity:1;
}

.slide-img{
width:100%;
height:100%;
object-fit:cover; /* full screen photo */
filter:brightness(0.7);
}

.glass-msg{
position:absolute;
bottom:80px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:380px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);
border-radius:20px;
padding:20px;
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 8px 32px rgba(0,0,0,0.3);
animation:slideUp 1.5s ease;
}

@keyframes slideUp{
from{opacity:0; transform:translateX(-50%) translateY(50px);}
to{opacity:1; transform:translateX(-50%) translateY(0);}
}

.glass-msg p{
color:white;
font-size:18px;
font-weight:400;
line-height:1.7;
text-align:center;
text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

h1{
position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);
font-family:'Dancing Script',cursive;
font-size:48px;
color:white;
z-index:15;
text-shadow:0 4px 20px rgba(0,0,0,0.7);
animation:glow 3s ease-in-out infinite alternate;
}

@keyframes glow{
from{text-shadow:0 4px 20px rgba(255,255,255,0.5);}
to{text-shadow:0 4px 30px rgba(116,185,255,1);}
}

#startBtn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:18px 45px;
border:none;
border-radius:50px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
z-index:25;
border:2px solid rgba(255,255,255,0.4);
transition:0.4s;
}

#startBtn:hover{
background:rgba(255,255,255,0.3);
transform:translate(-50%,-50%) scale(1.1);
}

#finalMsg{
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
display:none;
text-align:center;
z-index:15;
}

#finalMsg p{
font-family:'Dancing Script',cursive;
font-size:28px;
color:white;
text-shadow:0 2px 15px rgba(0,0,0,0.7);
margin-bottom:20px;
}

#btnGroup{
display:none;
}

#btnGroup button{
padding:14px 30px;
margin:8px;
border:none;
border-radius:50px;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(15px);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
border:1px solid rgba(255,255,255,0.4);
}

.heart{
position:absolute;
font-size:20px;
animation:floatHeart 8s ease-in infinite;
color:rgba(255,255,255,0.8);
z-index:10;
}

@keyframes floatHeart{
0%{transform:translateY(100vh) rotate(0deg); opacity:0;}
10%{opacity:1;}
90%{opacity:1;}
100%{transform:translateY(-100vh) rotate(720deg); opacity:0;}
}
</style>
</head>

  </div>
</div>
