<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ammu</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #ffd6e8, #ffc9e3);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  .container {
    text-align: center;
    position: relative;
    width: 90%;
    max-width: 400px;
  }

  .envelope {
    width: 280px;
    height: 180px;
    background: #ffb3d9;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
    margin: 0 auto;
  }

  .envelope:hover {
    transform: scale(1.05);
  }

  .envelope-flap {
    width: 0;
    height: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-bottom: 90px solid #ff80bf;
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 10px 10px 0 0;
    transform-origin: top;
    transition: transform 0.8s ease;
    z-index: 3;
  }

  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
  }

  .heart {
    width: 30px;
    height: 30px;
    background: #ff3366;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    z-index: 4;
    transition: opacity 0.4s ease;
  }

  .heart:before,
  .heart:after {
    content: '';
    width: 30px;
    height: 30px;
    background: #ff3366;
    border-radius: 50%;
    position: absolute;
  }

  .heart:before {
    top: -15px;
    left: 0;
  }

  .heart:after {
    left: -15px;
    top: 0;
  }

  .envelope.open .heart {
    opacity: 0;
  }

  .floating-sorry {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 42px;
    font-weight: 900;
    color: #e63976;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.6), 2px 2px 10px rgba(0,0,0,0.1);
    opacity: 0;
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 2px;
  }

  .envelope.open .floating-sorry {
    animation: floatUp 3.5s ease forwards;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    25% { opacity: 1; transform: translate(-50%, -180%) scale(1.3); }
    70% { opacity: 1; transform: translate(-50%, -250%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -350%) scale(0.8); }
  }

  .letter {
    width: 260px;
    height: 0;
    background: #fff;
    position: absolute;
    top: 15px;
    left: 10px;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    z-index: 2;
    overflow: hidden;
    transition: height 0.8s ease 0.4s, top 0.8s ease 0.4s;
  }

  .envelope.open .letter {
    height: 380px;
    top: -280px;
  }

  .letter-content {
    padding: 15px 20px;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .page {
    position: absolute;
    width: calc(100% - 40px);
    height: calc(100% - 50px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
    color: #444;
    font-size: 14px;
    line-height: 1.6;
    text-align: left;
    top: 0;
    left: 20px;
  }

  .page.active {
    opacity: 1;
    visibility: visible;
    z-index: 1;
  }

  .page h2 {
    color: #e63976;
    font-size: 20px;
    margin-bottom: 8px;
    text-align: center;
  }

  .photo-container {
    display: flex;
    gap: 8px;
    margin: 10px 0;
    justify-content: center;
  }

  .photo {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    object-fit: cover;
    border: 3px solid #ffb3d9;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .whatsapp-btn {
    display: inline-block;
    background: #25d366;
    color: white;
    padding: 8px 16px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 10px;
    transition: transform 0.2s ease;
