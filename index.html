<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Arthi 💙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #B0E0E6 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
position:relative;
}

.cloud{
position:absolute;
background:white;
border-radius:50%;
opacity:0.6;
animation:floatCloud 60s linear infinite;
}

@keyframes floatCloud{
0%{transform:translateX(-200px);}
100%{transform:translateX(100vw);}
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.3);
backdrop-filter:blur(20px);
border-radius:30px;
padding:30px 25px;
text-align:center;
box-shadow:0 15px 50px rgba(135,206,235,.4);
border:2px solid rgba(255,255,255,.4);
z-index:10;
}

h1{
font-family:'Dancing Script',cursive;
font-size:50px;
color:#0984e3;
margin-bottom:15px;
text-shadow:0 2px 10px rgba(255,255,255,.8);
}

.slider-container{
width:230px;
height:230px;
margin:20px auto;
border-radius:50%;
border:6px solid white;
box-shadow:0 10px 30px rgba(0,105,148,.3);
overflow:hidden;
position:relative;
display:none;
}

.slide{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
top:0;
left:0;
opacity:0;
transition:opacity 1.5s ease-in-out;
}

.slide.active{
opacity:1;
}

#messageBox{
color:#2d3436;
font-size:17px;
line-height:1.9;
min-height:150px;
margin:25px 0;
font-weight:500;
display:none;
}

.cursor{
border-right:3px solid #0984e3;
animation:blink 0.8s infinite;
}

@keyframes blink{
50%{border-color:transparent;}
}

#finalChance{
display:none;
font-family:'Dancing Script',cursive;
font-size:28px;
color:#0984e3;
margin:20px 0;
animation:fadeInPop 1.2s ease;
text-shadow:0 2px 10px rgba(116,185,255,.5);
}

@keyframes fadeInPop{
0%{opacity:0; transform:scale(0.5);}
70%{transform:scale(1.1);}
100%{opacity:1; transform:scale(1);}
}

button{
padding:15px 35px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#74b9ff,#0984e3);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
margin:10px;
transition:0.4s;
box-shadow:0 8px 20px rgba(116,185,255,.4);
font-family:'Poppins',sans-serif;
}

button:hover{
transform:translateY(-4px);
}

#btnGroup{
display:none;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.heart{
position:absolute;
font-size:25px;
animation:floatHeart 6s ease-in infinite;
opacity:0;
color:#0984e3;
z-index:1;
}

@keyframes floatHeart{
0%{transform:translateY(100vh) rotate(0deg); opacity:1;}
100%{transform:translateY(-100vh) rotate(360deg); opacity:0;}
}
</style>
</head>
<body>

<div class="cloud" style="width:100px; height:40px; top:10%;"></div>
<div class="cloud" style="width:150px; height:50px; top:25%; animation-delay:20s;"></div>

<div class="card">
<h1>Sorry Arthi 💙</h1>

<div class="slider-container" id="slider"></div>

<div id="messageBox"></div>

<div id="finalChance">Enakku oru chance kudu please 🙏<br>I promise I won't hurt you again ❤️</div>

<button id="startBtn">Open My Heart</button>

<div id="btnGroup">
<button onclick="alert('Thank you for giving me a chance ❤️')">I Forgive You</button>
<button onclick="alert('I\'m waiting for you... Please talk 🙏')">Can We Talk?</button>
</div>
</div>

<script>
const photos = [
  "IMG-20240720-WA0034.jpg",
  "IMG-20250126-WA0053.jpg",
  "IMG-20251112-WA0023.jpg",
  "IMG-20251224-WA0021.jpg",
  "IMG-20251224-WA0025.jpg",
  "image.jpg"
];

const fullMessage = `Arthi... 💙

Naa sryy da... neraiya alaga kekuren 😔

Anaiku naa panna adhu periya thappu.
Unna un frnds munadi asinga paduthiten.
Adha nenaicha enaku azhuga varudhu.

Namma memories ellam romba azhaga iruku.
Oru kovathula adha spoil pannen.

Please enna mannichudu.
Unna illama naan illa.
Inime apdi nadakave nadakathu, promise.`;

let currentSlide = 0;
let textIndex = 0;
let slideInterval;
let started = false;

// Create images
const slider = document.getElementById('slider');
photos.forEach((src, index) => {
  let img = document.createElement('img');
  img.src = src;
  img.className = 'slide';
  img.onerror = function(){ this.style.display='none'; }
  if(index === 0) img.classList.add('active');
  slider.appendChild(img);
});

document.getElementById('startBtn').addEventListener('click', startSorry);

function startSorry(){
  if(started) return;
  started = true;

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('slider').style.display = 'block';
  document.getElementById('messageBox').style.display = 'block';

  slideInterval = setInterval(nextSlide, 4000);
  typeMessage();

  for(let j=0; j<30; j++){
    setTimeout(createHeart, j * 300);
  }
}

function nextSlide(){
  const slides = document.querySelectorAll('.slide');
  if(slides.length === 0) return;
  slides[currentSlide].classList.remove('active');
  currentSlide = (currentSlide + 1) % slides.length;
  slides[currentSlide].classList.add('active');
}

function typeMessage(){
  if(textIndex < fullMessage.length){
    let char = fullMessage.charAt(textIndex);
    document.getElementById('messageBox').innerHTML += char === '\n'? '<br>' : char;
    document.getElementById('messageBox').innerHTML += '<span class="cursor"></span>';
    textIndex++;
    setTimeout(typeMessage, 65);
  } else {
    let cursor = document.querySelector('.cursor');
    if(cursor) cursor.remove();

    // Last la "oru chance" message + buttons varum
    document.getElementById('finalChance').style.display = 'block';
    document.getElementById('btnGroup').style.display = 'block';
    clearInterval(slideInterval);
  }
}

function createHeart(){
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '💙';
  heart.style.left = Math.random() * 100 + '%';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}
</script>

</body>
</html>
