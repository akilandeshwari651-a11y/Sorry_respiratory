<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Ammu... 🥺❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Envelope Framework --- */
        .envelope-wrapper {
            cursor: pointer;
            position: relative;
            animation: float 3s ease-in-out infinite;
            display: block; /* Direct visual anchor */
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: #ffb3c6;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #ff85a1;
        }

        .pocket {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 140px solid #ffccd5;
            border-right: 140px solid #ffccd5;
            border-bottom: 90px solid #ffccd5;
            border-radius: 0 0 15px 15px;
        }

        .heart-seal {
            position: absolute;
            top: 80px;
            left: 122px;
            font-size: 2.2rem;
            animation: heartbeat 1.2s infinite;
            z-index: 5;
        }

        .click-text {
            position: absolute;
            bottom: -45px;
            width: 100%;
            text-align: center;
            font-weight: 600;
            color: #ff4d6d;
            font-size: 1.1rem;
        }

        /* --- Card Base UI --- */
        .card {
            background: rgba(255, 255, 255, 0.96);
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 117, 143, 0.2);
            text-align: center;
            width: 100%;
            border: 2px solid #ffb3c6;
            backdrop-filter: blur(5px);
            animation: slideUp 0.4s ease-out forwards;
        }

        .floating-sorry {
            font-size: 2.8rem;
            font-weight: 700;
            color: #ff4d6d;
            letter-spacing: 4px;
            margin-bottom: 20px;
            animation: float 2.5s ease-in-out infinite;
        }

        .font-caveat {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem !important;
            line-height: 1.4 !important;
        }

        .message {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .emoji-section {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        /* --- Button Systems Layout --- */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            height: 60px;
            position: relative;
            width: 100%;
        }

        button {
            font-family: 'Poppins', sans-serif;
            padding: 12px 30px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .acceptBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
        }

        .acceptBtn:hover {
            background-color: #ff758f;
            transform: scale(1.05);
        }

        .noBtn {
            background-color: #6c757d;
            color: white;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* --- Final Screen Special UI --- */
        .final-card {
            border: 3px dashed #ff4d6d;
            background: #fff0f3;
        }

        .final-title {
            font-family: 'Caveat', cursive;
            color: #ff1493;
            font-size: 2.6rem;
            margin-bottom: 10px;
        }

        .final-msg {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ff4d6d;
            margin-bottom: 15px;
        }

        .sub-msg {
            font-size: 1rem;
            color: #6a6a6a;
            font-style: italic;
            background: white;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ffccd5;
        }

        .hearts {
            font-size: 2.5rem;
            margin-top: 15px;
            animation: heartbeat 1.2s infinite;
        }

        /* --- Animations Engine --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="displayBox">
        
        <div class="envelope-wrapper" id="envelopeActive" onclick="triggerStep2(event)">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="heart-seal">❤️</div>
                <p class="click-text">Tap to open, Ammu... ✨</p>
            </div>
        </div>

    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Core Logic Container variables
        const displayBox = document.getElementById('displayBox');
        const music = document.getElementById('bgMusic');

        // Dynamic HTML segments for bulletproof page rendering
        const step2Content = `
            <div class="card">
                <div class="floating-sorry">S O R R Y 🥺</div>
                <p class="message font-caveat">Unna romba miss pandren di paapu... Neeyum enna miss pandriya? 🥺❤️</p>
                <div class="btn-group">
                    <button class="acceptBtn" onclick="triggerStep3(event)">Yes 🥰</button>
                    <button class="noBtn" onmouseover="moveButton(this)" onclick="moveButton(this)" ontouchstart="moveButton(this)">No 😡</button>
                </div>
            </div>`;

        const step3Content = `
            <div class="card">
                <div class="emoji-section">🥺👉👈</div>
                <p class="message font-caveat">En kitta pesama irundha enakkum romba valikkuthu ma. Thirumba en kooda eppolum pola pesuvia? Please... ❤️</p>
                <div class="btn-group">
                    <button class="acceptBtn" onclick="triggerStep4(event)">Yes 🥺</button>
                    <button class="noBtn" onmouseover="moveButton(this)" onclick="moveButton(this)" ontouchstart="moveButton(this)">No 😡</button>
                </div>
            </div>`;

        const step4Content = `
            <div class="card final-card">
                <div class="emoji-section" style="animation: heartbeat 1.5s infinite;">🥰💖</div>
                <h1 class="final-title">I knew you would forgive me!</h1>
                <p class="final-msg">I love you so much, my Ammu paapu! ❤️✨</p>
                <p class="sub-msg">Ippo chat-la vandhu enakku "Love you" sollu... Waiting! 😘👉👈</p>
                <div class="hearts">❤️❤️❤️</div>
            </div>`;

        // Execution Logic functions
        function triggerStep2(event) {
            if(event) event.preventDefault();
            
            // Audio execution check
            music.volume = 0.4;
            music.play().catch(e => console.log("Audio cached natively"));

            // Inject contents forcefully
            displayBox.innerHTML = step2Content;
        }

        function triggerStep3(event) {
            if(event) event.stopPropagation();
            displayBox.innerHTML = step3Content;
        }

        function triggerStep4(event) {
            if(event) event.stopPropagation();
            displayBox.innerHTML = step4Content;
            
            music.volume = 0.6;
        }

        // Fixed anti-click algorithm parameters
        function moveButton(btnElement) {
            const padding = 35;
            const maxX = window.innerWidth - btnElement.offsetWidth - padding;
            const maxY = window.innerHeight - btnElement.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            btnElement.style.position = 'fixed';
            btnElement.style.left = randomX + 'px';
            btnElement.style.top = randomY + 'px';
            btnElement.style.zIndex = "999";
        }
    </script>
</body>
</html>
